<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geschützte Seite</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b0f19;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background-color: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 32px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    .icon-lock {
      width: 48px;
      height: 48px;
      margin: 0 auto 16px;
      background: rgba(99, 102, 241, 0.1);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6366f1;
    }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 8px; color: #fff; }
    p { font-size: 13px; color: #94a3b8; margin-bottom: 24px; line-height: 1.5; }
    input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid #374151;
      background: #030712;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="password"]:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.25);
    }
    button {
      margin-top: 16px;
      width: 100%;
      padding: 12px 20px;
      background: #6366f1;
      border: none;
      border-radius: 10px;
      color: #fff;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: filter 0.2s, transform 0.1s;
    }
    button:hover { filter: brightness(1.1); }
    button:active { transform: scale(0.98); }
    .error-msg {
      margin-top: 14px;
      color: #f87171;
      font-size: 12px;
      display: none;
    }
    .spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card" id="sc_login_card">
    <div class="icon-lock">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </div>
    <h1>Geschützte Seite</h1>
    <p>Bitte gib das Passwort ein, um die Seite zu entschlüsseln.</p>
    <form id="sc_form">
      <input type="password" id="sc_pass" placeholder="Passwort eingeben..." autofocus required autocomplete="current-password">
      
      <button type="submit" id="sc_submit">
        <span id="sc_btn_text">Entschlüsseln</span>
        <div class="spinner" id="sc_spinner"></div>
      </button>
      <div id="sc_error" class="error-msg">Falsches Passwort oder beschädigte Daten!</div>
    </form>
  </div>

      const STORAGE_KEY = 'sc_auth_' + location.pathname;

      function b64ToBuf(b64) {
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return bytes.buffer;
      }

      async function attemptDecrypt(password) {
        const enc = new TextEncoder();
        const salt = b64ToBuf(payload.salt);
        const iv = b64ToBuf(payload.iv);
        const ciphertext = b64ToBuf(payload.ciphertext);

        const passKey = await crypto.subtle.importKey(
          'raw', enc.encode(password), { name: 'PBKDF2' }, false, ['deriveKey']
        );

        const key = await crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: salt, iterations: payload.iterations, hash: 'SHA-256' },
          passKey,
          { name: 'AES-GCM', length: 256 },
          false,
          ['decrypt']
        );

        const decryptedBuf = await crypto.subtle.decrypt(
          { name: 'AES-GCM', iv: iv }, key, ciphertext
        );

        return new TextDecoder().decode(decryptedBuf);
      }

      function injectDecryptedPage(html) {
        document.open();
        document.write(html);
        document.close();
      }

      // Check remember me session
      if (sessionStorage.getItem(STORAGE_KEY)) {
        try {
          const savedPass = sessionStorage.getItem(STORAGE_KEY);
          attemptDecrypt(savedPass).then(injectDecryptedPage).catch(() => {
            sessionStorage.removeItem(STORAGE_KEY);
          });
        } catch(e) {}
      }

      const form = document.getElementById('sc_form');
      const passInput = document.getElementById('sc_pass');
      const btnText = document.getElementById('sc_btn_text');
      const spinner = document.getElementById('sc_spinner');
      const errorEl = document.getElementById('sc_error');
      const rememberCheckbox = document.getElementById('sc_remember');

      form.addEventListener('submit', async function(e) {
        e.preventDefault();
        const pass = passInput.value;
        if (!pass) return;

        btnText.style.display = 'none';
        spinner.style.display = 'block';
        errorEl.style.display = 'none';

        try {
          const html = await attemptDecrypt(pass);
          if (rememberCheckbox && rememberCheckbox.checked) {
            sessionStorage.setItem(STORAGE_KEY, pass);
          }
          injectDecryptedPage(html);
        } catch (err) {
          btnText.style.display = 'block';
          spinner.style.display = 'none';
          errorEl.style.display = 'block';
          passInput.focus();
        }
      });
    })();
